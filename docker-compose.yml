services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hr-portal-app
    environment:
      REDIS_URL: redis://hr-portal-redis:6379/0
    # The WAF needs to find the app here:
    ports:
      - "8521:8521" 
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hr-portal-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data: